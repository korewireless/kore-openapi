                          items:
                            type: object
                            properties:
                              key:
                                type: string
                              value:
                                type: string
                            example: null
                            $$ref: '#/components/schemas/SubscriptionDetails_additionalfields'
                      $$ref: '#/components/schemas/SubscriptionDetails'
