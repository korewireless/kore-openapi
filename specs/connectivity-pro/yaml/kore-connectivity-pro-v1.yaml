  /v1/accounts/{account-id}/esim-profile-delete-requests:
    post:
      tags:
      - eSIM Profile Management
      summary: Create A Delete Profile Request
      description: Create a delete profile request for an account. Deletes a specified profile from the eSIM.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delete:
                  type: object
                  properties:
                    subscriptions:
                      type: array
                      items:
                        type: object
                        properties:
                          eid:
                            type: string
                            description: The unique identifier of the eSIM
                            example: '0000000000000000000000000'
                          iccid:
                            type: string
                            description: The unique identifier of the profile to be deleted
                            example: '0000000000000000'
                        required:
                        - eid
                        - iccid
                      description: ' '
                    skip-session-check:
                      type: boolean
                      example: false
                      description: Used to skip the initial in-session check for an eSIM
                    disable-autoretry:
                      type: boolean
                      example: false
                      description: Disables retry of RSP steps based on in-session event when set to true, when set to false the RSP step will be retried max 5 times
